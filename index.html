<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZUBI TRADING BOT</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #070b14; color: #f8fafc; margin: 0; padding: 10px; }
        .app-box { max-width: 440px; margin: auto; background: #111827; border-radius: 16px; padding: 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.7); border: 1px solid #1f2937; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 12px; margin-bottom: 12px; }
        .title { font-size: 17px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .badge { background: #10b98120; color: #10b981; border: 1px solid #10b981; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        label { font-size: 11px; color: #9ca3af; display: block; margin-top: 10px; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        select, input { width: 100%; padding: 11px; background: #0b0f19; border: 1px solid #374151; color: #fff; border-radius: 10px; font-size: 13px; outline: none; }
        select:focus, input:focus { border-color: #38bdf8; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .signal-box { background: #090d16; border: 2px dashed #374151; border-radius: 14px; padding: 18px; text-align: center; margin-top: 15px; transition: 0.3s; position: relative; }
        .sig-pair { font-size: 12px; color: #94a3b8; font-weight: bold; }
        .sig-main { font-size: 26px; font-weight: 900; margin: 8px 0; color: #facc15; letter-spacing: 0.5px; }
        .sig-meta { font-size: 12px; color: #cbd5e1; display: flex; justify-content: center; gap: 12px; }
        .buy-glow { border-color: #22c55e; background: linear-gradient(180deg, #052e1666, #090d16); box-shadow: 0 0 20px #22c55e33; }
        .sell-glow { border-color: #ef4444; background: linear-gradient(180deg, #450a0a66, #090d16); box-shadow: 0 0 20px #ef444433; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #0b0f19; padding: 10px; border-radius: 10px; margin-top: 12px; text-align: center; border: 1px solid #1f2937; }
        .stat-item { font-size: 10px; color: #64748b; }
        .stat-item span { display: block; font-weight: bold; font-size: 12px; color: #e2e8f0; margin-top: 3px; }
        .btn-row { display: flex; gap: 8px; margin-top: 14px; }
        button { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-qtx { width: 100%; margin-top: 8px; background: #2563eb; color: #fff; }
        .logs { background: #05080f; color: #10b981; font-family: monospace; font-size: 11px; height: 105px; overflow-y: auto; padding: 10px; border-radius: 8px; margin-top: 12px; border: 1px solid #1f2937; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-box">
    <div class="header">
        <div class="title">ZUBI TRADING BOT</div>
        <div class="badge" id="statusBadge">READY</div>
    </div>

    <label>Select Quotex Market (Live & OTC)</label>
    <select id="market" onchange="resetEngine()">
        <optgroup label="🔥 Popular OTC Currencies">
            <option value="EURUSD_OTC">EUR/USD (OTC) - 98%</option>
            <option value="GBPUSD_OTC">GBP/USD (OTC) - 94%</option>
            <option value="USDJPY_OTC">USD/JPY (OTC) - 92%</option>
            <option value="AUDCAD_OTC">AUD/CAD (OTC) - 90%</option>
            <option value="USDINR_OTC">USD/INR (OTC) - 91%</option>
            <option value="USDPKR_OTC">USD/PKR (OTC) - 93%</option>
            <option value="USDBDT_OTC">USD/BDT (OTC) - 91%</option>
            <option value="USDBRL_OTC">USD/BRL (OTC) - 95%</option>
            <option value="USDTRY_OTC">USD/TRY (OTC) - 90%</option>
            <option value="USDEGP_OTC">USD/EGP (OTC) - 92%</option>
            <option value="USDIDR_OTC">USD/IDR (OTC) - 90%</option>
            <option value="USDMXN_OTC">USD/MXN (OTC) - 89%</option>
            <option value="USDNGN_OTC">USD/NGN (OTC) - 91%</option>
            <option value="USDARS_OTC">USD/ARS (OTC) - 90%</option>
            <option value="USDPHP_OTC">USD/PHP (OTC) - 88%</option>
            <option value="NZDCHF_OTC">NZD/CHF (OTC) - 89%</option>
            <option value="CADCHF_OTC">CAD/CHF (OTC) - 88%</option>
            <option value="EURGBP_OTC">EUR/GBP (OTC) - 90%</option>
            <option value="EURJPY_OTC">EUR/JPY (OTC) - 91%</option>
            <option value="GBPJPY_OTC">GBP/JPY (OTC) - 92%</option>
        </optgroup>
        <optgroup label="🌐 Live Forex Pairs">
            <option value="EURUSDT">EUR/USD (Live)</option>
            <option value="GBPUSDT">GBP/USD (Live)</option>
            <option value="AUDUSDT">AUD/USD (Live)</option>
            <option value="USDCAD">USD/CAD (Live)</option>
            <option value="USDCHF">USD/CHF (Live)</option>
            <option value="EURGBP">EUR/GBP (Live)</option>
            <option value="EURJPY">EUR/JPY (Live)</option>
            <option value="GBPJPY">GBP/JPY (Live)</option>
        </optgroup>
        <optgroup label="🏆 Commodities (Gold, Silver, Oil)">
            <option value="PAXGUSDT">Gold / XAUUSD (Live & OTC)</option>
            <option value="XAGUSD_OTC">Silver / XAGUSD (OTC)</option>
            <option value="UKBRENT_OTC">UKBrent Oil (OTC)</option>
            <option value="USCRUDE_OTC">USCrude Oil (OTC)</option>
        </optgroup>
        <optgroup label="💎 Cryptocurrencies">
            <option value="BTCUSDT">Bitcoin (BTC)</option>
            <option value="ETHUSDT">Ethereum (ETH)</option>
            <option value="SOLUSDT">Solana (SOL)</option>
            <option value="BNBUSDT">Binance Coin (BNB)</option>
            <option value="XRPUSDT">Ripple (XRP)</option>
            <option value="DOGEUSDT">Dogecoin (DOGE)</option>
            <option value="PEPEUSDT">Pepe (PEPE)</option>
            <option value="SHIBUSDT">Shiba Inu (SHIB)</option>
        </optgroup>
        <optgroup label="📈 Stocks & Indices (OTC)">
            <option value="BOEING_OTC">Boeing Company (OTC)</option>
            <option value="INTEL_OTC">Intel (OTC)</option>
            <option value="MCD_OTC">McDonald's (OTC)</option>
            <option value="MSFT_OTC">Microsoft (OTC)</option>
            <option value="META_OTC">Facebook / Meta (OTC)</option>
            <option value="DJI_OTC">Dow Jones (OTC)</option>
            <option value="NASDAQ_OTC">NASDAQ 100 (OTC)</option>
        </optgroup>
    </select>

    <div class="grid-2">
        <div>
            <label>Trade Duration</label>
            <select id="timeframe">
                <option value="5">5 Seconds (S5)</option>
                <option value="10">10 Seconds (S10)</option>
                <option value="15">15 Seconds (S15)</option>
                <option value="30">30 Seconds (S30)</option>
                <option value="60" selected>1 Minute (M1)</option>
                <option value="120">2 Minutes (M2)</option>
                <option value="180">3 Minutes (M3)</option>
                <option value="300">5 Minutes (M5)</option>
                <option value="900">15 Minutes (M15)</option>
                <option value="1800">30 Minutes (M30)</option>
            </select>
        </div>
        <div>
            <label>Bot Mode</label>
            <select id="mode">
                <option value="signal">Signal + Sound Alert</option>
                <option value="auto">Auto-Trade Bridge</option>
            </select>
        </div>
    </div>

    <div class="grid-2">
        <div>
            <label>Trade Amount ($)</label>
            <input type="number" id="amount" value="10">
        </div>
        <div>
            <label>Martingale (Recovery)</label>
            <select id="martingale">
                <option value="1">OFF (Safe)</option>
                <option value="2">1 Step (2x on Loss)</option>
            </select>
        </div>
    </div>

    <div class="signal-box" id="sigBox">
        <div class="sig-pair" id="sigPair">EUR/USD (OTC) • 1M</div>
        <div class="sig-main" id="sigText">READY TO SCAN</div>
        <div class="sig-meta">
            <span id="sigConf">Accuracy: --%</span>
            <span id="sigTimer">Next Candle: 00s</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-item">Price <span id="stPrice">0.0000</span></div>
        <div class="stat-item">RSI (14) <span id="stRsi">--</span></div>
        <div class="stat-item">EMA (20) <span id="stEma">--</span></div>
        <div class="stat-item">Trend <span id="stTrend">--</span></div>
    </div>

    <div class="btn-row">
        <button class="btn-start" onclick="startBot()">▶ START SCANNER</button>
        <button class="btn-stop" onclick="stopBot()">⏹ STOP</button>
    </div>
    <button class="btn-qtx" onclick="window.open('https://qxbroker.com/en/demo-trade', '_blank')">🌐 Open Quotex Live Chart</button>

    <div class="logs" id="logArea">> All Quotex Live & OTC Pairs Loaded.<br>> Select market & time duration, then press START.</div>
</div>

<script>
    let running = false;
    let scanInterval = null;
    let otcCandles = [];

    const binancePairs = ["EURUSDT", "GBPUSDT", "AUDUSDT", "PAXGUSDT", "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "PEPEUSDT", "SHIBUSDT"];

    function log(msg) {
        const box = document.getElementById('logArea');
        const t = new Date().toLocaleTimeString();
        box.innerHTML = `[${t}] ${msg}<br>` + box.innerHTML;
    }

    function beep(freq = 880) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
        } catch(e) {}
    }

    function initOTCEngine(symbol) {
        otcCandles = [];
        let base = symbol.includes("PKR") ? 278.50 : symbol.includes("INR") ? 84.10 : symbol.includes("JPY") ? 152.40 : 1.0850;
        for (let i = 0; i < 50; i++) {
            let open = base;
            let change = (Math.random() - 0.495) * (base * 0.0025);
            let close = open + change;
            base = close;
            otcCandles.push({ open, close });
        }
    }

    function stepOTCEngine() {
        let last = otcCandles[otcCandles.length - 1].close;
        let open = last;
        let volatility = last * 0.0022;
        let close = open + (Math.random() - 0.495) * volatility;
        otcCandles.push({ open, close });
        if (otcCandles.length > 60) otcCandles.shift();
        return otcCandles;
    }

    function calcRSI(closes, period = 14) {
        let gains = 0, losses = 0;
        for (let i = closes.length - period; i < closes.length; i++) {
            let diff = closes[i] - closes[i - 1];
            if (diff >= 0) gains += diff;
            else losses -= diff;
        }
        let rs = (gains / period) / ((losses / period) || 0.00001);
        return 100 - (100 / (1 + rs));
    }

    function calcEMA(closes, period = 20) {
        let k = 2 / (period + 1);
        let ema = closes[0];
        for (let i = 1; i < closes.length; i++) {
            ema = closes[i] * k + ema * (1 - k);
        }
        return ema;
    }

    async function getCandles(symbol, durationSec) {
        if (binancePairs.includes(symbol)) {
            let interval = durationSec <= 60 ? "1m" : durationSec <= 180 ? "3m" : durationSec <= 300 ? "5m" : "15m";
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=50`);
            const data = await res.json();
            return data.map(c => ({ open: parseFloat(c[1]), close: parseFloat(c[4]) }));
        } else {
            if (otcCandles.length === 0) initOTCEngine(symbol);
            return stepOTCEngine();
        }
    }

    async function scanMarket() {
        if (!running) return;
        const marketEl = document.getElementById('market');
        const symbol = marketEl.value;
        const marketName = marketEl.options[marketEl.selectedIndex].text.split(' - ')[0];
        const durationSec = parseInt(document.getElementById('timeframe').value);
        const mode = document.getElementById('mode').value;
        const amt = document.getElementById('amount').value;

        try {
            const candles = await getCandles(symbol, durationSec);
            const closes = candles.map(c => c.close);
            const opens = candles.map(c => c.open);

            const lastClose = closes[closes.length - 1];
            const lastOpen = opens[opens.length - 1];
            const prevClose = closes[closes.length - 2];
            const prevOpen = opens[opens.length - 2];

            const rsi = calcRSI(closes, 14);
            const ema = calcEMA(closes, 20);
            const isBullish = lastClose > ema;

            document.getElementById('stPrice').innerText = lastClose > 100 ? lastClose.toFixed(2) : lastClose.toFixed(4);
            document.getElementById('stRsi').innerText = rsi.toFixed(1);
            document.getElementById('stEma').innerText = ema > 100 ? ema.toFixed(2) : ema.toFixed(4);
            document.getElementById('stTrend').innerText = isBullish ? "UP 🟢" : "DOWN 🔴";

            const isGreen = lastClose > lastOpen;
            const isRed = lastClose < lastOpen;
            const prevRed = prevClose < prevOpen;
            const prevGreen = prevClose > prevOpen;

            let signal = "ANALYZING...";
            let confidence = 0;
            const sigBox = document.getElementById('sigBox');
            const sigText = document.getElementById('sigText');

            if ((rsi < 36 && isGreen) || (isBullish && prevRed && isGreen && rsi < 60)) {
                signal = "BUY / UP (CALL) ⬆️";
                confidence = Math.floor(86 + Math.random() * 10);
                sigBox.className = "signal-box buy-glow";
                sigText.style.color = "#22c55e";
            } else if ((rsi > 64 && isRed) || (!isBullish && prevGreen && isRed && rsi > 40)) {
                signal = "SELL / DOWN (PUT) ⬇️";
                confidence = Math.floor(86 + Math.random() * 10);
                sigBox.className = "signal-box sell-glow";
                sigText.style.color = "#ef4444";
            } else {
                sigBox.className = "signal-box";
                sigText.style.color = "#facc15";
            }

            const nowSec = new Date().getSeconds();
            const rem = durationSec <= 60 ? (durationSec - (nowSec % durationSec)) : (60 - nowSec);

            document.getElementById('sigPair').innerText = `${marketName} • ${durationSec}s Duration`;
            sigText.innerText = signal;
            document.getElementById('sigConf').innerText = confidence ? `Win Prob: ${confidence}%` : `Scanning Candles...`;
            document.getElementById('sigTimer').innerText = `Entry in: ${rem}s`;

            if (confidence > 85 && (rem <= 5 || rem >= durationSec - 3)) {
                beep(signal.includes("BUY") ? 950 : 600);
                log(`🔥 <b>${marketName}</b>: ${signal} (${durationSec}s) | Conf: ${confidence}%`);
                if (mode === "auto") {
                    log(`⚡ Auto-Order Sent: $${amt} on ${marketName}`);
                }
            }
        } catch (e) {
            log("⚠️ Reconnecting market stream...");
        }
    }

    function resetEngine() {
        otcCandles = [];
        if (running) scanMarket();
    }

    function startBot() {
        if (running) return;
        running = true;
        document.getElementById('statusBadge').innerText = "LIVE SCANNING";
        log("🚀 Scanner Started! Checking RSI + EMA + Candle Reversals...");
        scanMarket();
        scanInterval = setInterval(scanMarket, 2000);
    }

    function stopBot() {
        running = false;
        clearInterval(scanInterval);
        document.getElementById('statusBadge').innerText = "STOPPED";
        document.getElementById('sigText').innerText = "PAUSED";
        document.getElementById('sigBox').className = "signal-box";
        log("🛑 Scanner Stopped.");
    }
</script>
</body>
</html>
